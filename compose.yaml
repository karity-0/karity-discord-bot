services:
  bot:
    build: .
    init: true
    restart: unless-stopped
    env_file: .env
    environment:
      KARITY_ENGINE_PATH: /opt/karity
      KARITY_JOBS_PATH: /work/jobs
    read_only: true
    tmpfs:
      - /work/jobs:rw,noexec,nosuid,nodev,size=512m,uid=10001,gid=10001,mode=0700
      - /tmp:rw,noexec,nosuid,nodev,size=64m,uid=10001,gid=10001,mode=0700
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    mem_limit: 1g
    cpus: 2.0
    pids_limit: 64
    stop_grace_period: 30s
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: "3"
