[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "karity-discord-bot"
version = "0.1.0"
description = "Self-hostable Discord interface for Karity Obfuscator"
readme = "README.md"
requires-python = ">=3.12"
license = "MIT"
dependencies = [
  "discord.py==2.6.4",
  "aiohttp==3.14.5",
  "python-dotenv==1.2.1",
  "luaparser==4.2.0",
  "tree_sitter==0.26.0",
  "tree_sitter_lua==0.5.0",
  "lupa==2.8",
]

[project.scripts]
karity-bot = "karity_bot.__main__:main"

[tool.setuptools.packages.find]
include = ["karity_bot*"]

[tool.setuptools.package-data]
karity_bot = ["engine.lock.json"]
